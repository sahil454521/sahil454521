name: Live status

# Keeps the "In production" board in README.md honest: fetches every live site and rewrites it.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/status.mjs, .github/workflows/status.yml]

permissions:
  contents: write

concurrency:
  group: live-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/status.mjs
      - name: Commit the board if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then echo "No change"; else git commit -m "Live status: refresh the In production board" && git push; fi
